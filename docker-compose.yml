services:
  app:
    build: .
    container_name: wolftek-app
    ports:
      - "8080:80"
    environment:
      APP_NAME: Wolftek
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      APP_LOCALE: es
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: wolftek
      DB_USERNAME: wolftek
      DB_PASSWORD: secret
    volumes:
      - storage:/var/www/html/storage/app
    depends_on:
      - db

  db:
    image: mysql:8.4
    container_name: wolftek-db
    environment:
      MYSQL_DATABASE: wolftek
      MYSQL_USER: wolftek
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    ports:
      - "3307:3306"
    volumes:
      - dbdata:/var/lib/mysql

volumes:
  dbdata:
  storage:
